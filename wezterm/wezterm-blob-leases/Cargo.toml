[package]
name = "wezterm-blob-leases"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/wez/wezterm"
description = "Manage image blob caching/leasing for wezterm"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
getrandom = "0.2"
once_cell = "1.8"
serde = {version="1.0", features=["derive"], optional=true}
sha2 = "0.10"
tempfile = {version="3.4", optional=true}
thiserror = "1.0"
uuid = {version="1.3", features=["v1", "rng"]}

# mac_address does not compile for iOS; excluded there (random node id fallback).
[target.'cfg(not(target_os = "ios"))'.dependencies]
mac_address = "1.1"

[features]
default = []
serde = ["dep:serde", "uuid/serde"]
simple_tempdir = ["dep:tempfile"]
